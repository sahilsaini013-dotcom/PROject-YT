name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: 54325
      EMAIL_FROM: Training Hub <no-reply@traininghub.app>
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Start Supabase (applies migrations + seed)
        run: npx supabase start -x edge-runtime,imgproxy,pooler,studio

      - name: Verify migrations replay clean
        run: npx supabase db reset

      - name: Negative RLS tests (pgTAP)
        run: npx supabase test db

      - name: Export local anon key for the app
        run: |
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(npx supabase status -o json | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>console.log(JSON.parse(d).ANON_KEY))')" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        # Verbose + one retry: browser CDN downloads are occasionally flaky,
        # and a silent exit 1 here previously gave nothing to debug.
        run: |
          set -x
          npx playwright install-deps chromium
          npx playwright install chromium || (sleep 10 && npx playwright install chromium)

      - name: E2E
        run: npx playwright test

      - name: Final UI audit screenshots
        run: |
          set -euo pipefail
          mkdir -p final-audit/screenshots

          APP_PID=""
          if ! curl -fsS http://127.0.0.1:3000 >/dev/null 2>&1; then
            npm run start --workspace apps/web > final-audit/next-start.log 2>&1 &
            APP_PID=$!
          fi
          cleanup() {
            if [ -n "$APP_PID" ]; then
              kill "$APP_PID" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT

          READY=0
          for _ in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null 2>&1; then
              READY=1
              break
            fi
            if [ -n "$APP_PID" ] && ! kill -0 "$APP_PID" 2>/dev/null; then
              cat final-audit/next-start.log
              exit 1
            fi
            sleep 2
          done
          if [ "$READY" != "1" ]; then
            cat final-audit/next-start.log
            exit 1
          fi

          node scripts/audit-screenshots.mjs final-audit/screenshots

      - name: Upload final UI audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-ui-audit
          path: final-audit/
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
