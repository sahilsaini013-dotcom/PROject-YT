<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920">
<style>
  .ring { fill:none; stroke:#C6FF00; transform-origin:540px 960px; opacity:0;
    animation: ring 4s cubic-bezier(.17,.67,.35,1) infinite; }
  .ring2 { animation-delay:.18s; stroke:#F5F7FA; }
  .p { opacity:0; animation: fly 4s cubic-bezier(.2,.7,.3,1) infinite; }
  .mark { transform-origin:549.4px 663.7px; transform-box:fill-box; animation: pop 4s cubic-bezier(.34,1.56,.64,1) infinite; }
  @keyframes ring { 0% { opacity:0; stroke-width:26; transform:scale(.12); }
    8% { opacity:.9; } 40% { opacity:0; stroke-width:2; transform:scale(1); } 100% { opacity:0; } }
  @keyframes fly { 0% { opacity:0; transform:translate(0,0) scale(.4); }
    6% { opacity:1; } 42% { opacity:0; transform:translate(var(--dx),var(--dy)) scale(1); } 100% { opacity:0; } }
  @keyframes pop { 0% { transform:scale(.6); opacity:0; } 10% { transform:scale(1.08); opacity:1; }
    16% { transform:scale(1); } 88% { transform:scale(1); opacity:1; } 100% { transform:scale(.6); opacity:0; } }
</style>
