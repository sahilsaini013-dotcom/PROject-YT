<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
<defs>
  <radialGradient id="pulse" cx="50%" cy="55%" r="60%">
    <stop offset="0%" stop-color="#C6FF00" stop-opacity="0.10"/>
    <stop offset="55%" stop-color="#C6FF00" stop-opacity="0.03"/>
    <stop offset="100%" stop-color="#C6FF00" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#C6FF00" stop-opacity="0"/>
    <stop offset="50%" stop-color="#C6FF00" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#C6FF00" stop-opacity="0"/>
  </linearGradient>
</defs>
<style>
  .grid line { stroke:#1D2127; stroke-width:1; }
  .glow { animation: breathe 8s ease-in-out infinite; transform-origin:960px 594px; }
  .hex { fill:none; stroke:#2A2F37; stroke-width:2; transform-origin:960px 540px; animation: spin 90s linear infinite; }
  .s1 { animation: sweep 8s linear infinite; }
  .s2 { animation: sweep 8s linear -2.6s infinite; opacity:.7 }
  .s3 { animation: sweep 8s linear -5.3s infinite; opacity:.45 }
  @keyframes breathe { 0%,100% { opacity:.55; transform:scale(1); } 50% { opacity:1; transform:scale(1.12); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes sweep { from { transform:translateX(-1400px); } to { transform:translateX(2600px); } }
</style>
<rect width="1920" height="1080" fill="#0B0D10"/>
<g class="grid"><line x1="0" y1="0" x2="0" y2="1080"/><line x1="160" y1="0" x2="160" y2="1080"/><line x1="320" y1="0" x2="320" y2="1080"/><line x1="480" y1="0" x2="480" y2="1080"/><line x1="640" y1="0" x2="640" y2="1080"/><line x1="800" y1="0" x2="800" y2="1080"/><line x1="960" y1="0" x2="960" y2="1080"/><line x1="1120" y1="0" x2="1120" y2="1080"/><line x1="1280" y1="0" x2="1280" y2="1080"/><line x1="1440" y1="0" x2="1440" y2="1080"/><line x1="1600" y1="0" x2="1600" y2="1080"/><line x1="1760" y1="0" x2="1760" y2="1080"/><line x1="1920" y1="0" x2="1920" y2="1080"/>
<line x1="0" y1="0" x2="1920" y2="0"/><line x1="0" y1="160" x2="1920" y2="160"/><line x1="0" y1="320" x2="1920" y2="320"/><line x1="0" y1="480" x2="1920" y2="480"/><line x1="0" y1="640" x2="1920" y2="640"/><line x1="0" y1="800" x2="1920" y2="800"/><line x1="0" y1="960" x2="1920" y2="960"/></g>
<circle class="glow" cx="960" cy="594" r="700" fill="url(#pulse)"/>
<polygon class="hex" points="960,140 1306,340 1306,740 960,940 614,740 614,340"/>
<g transform="rotate(-24 960 540)">
  <rect class="s1" x="0" y="300" width="900" height="3" fill="url(#streak)"/>
  <rect class="s2" x="0" y="560" width="700" height="2" fill="url(#streak)"/>
  <rect class="s3" x="0" y="820" width="800" height="2.5" fill="url(#streak)"/>
</g>
</svg>